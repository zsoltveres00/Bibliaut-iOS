name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bibliaut.xcodeproj \
            -target Bibliaut \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build/sim" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bibliaut.xcodeproj \
            -target Bibliaut \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Package unsigned .ipa
        run: |
          APP="$(find build/device/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Bibliaut-unsigned.ipa Payload)
          ls -la Bibliaut-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Bibliaut-unsigned-ipa
          path: Bibliaut-unsigned.ipa
          retention-days: 30
